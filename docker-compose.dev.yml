# Development Docker Compose for LifeThread Platform (Module 41)
# Features live reload, volume mounts, exposed debug ports, and non-blocking iteration

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifethread-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifethread_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifethread_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifethread_db_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifethread_user} -d ${POSTGRES_DB:-lifethread_db_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lifethread-dev-net

  redis:
    image: redis:7-alpine
    container_name: lifethread-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lifethread-dev-net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: lifethread-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifethread_user}:${POSTGRES_PASSWORD:-lifethread_dev_password}@postgres:5432/${POSTGRES_DB:-lifethread_db_dev}
      REDIS_URL: redis://redis:6379/0
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      JWT_SECRET_KEY: dev_insecure_secret_key_for_local_testing_only
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    volumes:
      - ./backend/app:/app/app
      - ./agent/lifethread_agent:/app/lifethread_agent
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lifethread-dev-net

  mcp-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mcp
    container_name: lifethread-mcp-dev
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8001
    volumes:
      - ./mcp-server/mcp_server:/app/mcp_server
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lifethread-dev-net

  agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: lifethread-agent-dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      AGENT_WORKER_PORT: 8002
      AGENT_WORKER_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifethread_user}:${POSTGRES_PASSWORD:-lifethread_dev_password}@postgres:5432/${POSTGRES_DB:-lifethread_db_dev}
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      MCP_SERVER_URL: http://mcp-server:8001
    volumes:
      - ./agent/lifethread_agent:/app/lifethread_agent
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lifethread-dev-net

  frontend:
    image: node:22-alpine
    container_name: lifethread-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lifethread-dev-net

volumes:
  postgres_dev_data:
    name: lifethread_postgres_dev_data
  redis_dev_data:
    name: lifethread_redis_dev_data

networks:
  lifethread-dev-net:
    name: lifethread_dev_network
    driver: bridge
