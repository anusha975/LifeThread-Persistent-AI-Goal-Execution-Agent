# Production Docker Compose for LifeThread Platform (Module 41)
# Fully containerized: frontend, backend, agent, mcp-server, postgres, redis
# Enforces: non-root containers, health checks, isolated networks, persistent volumes

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifethread-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifethread_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifethread_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifethread_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifethread_user} -d ${POSTGRES_DB:-lifethread_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lifethread-internal

  redis:
    image: redis:7-alpine
    container_name: lifethread-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lifethread-internal

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: lifethread-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifethread_user}:${POSTGRES_PASSWORD:-lifethread_secure_password}@postgres:5432/${POSTGRES_DB:-lifethread_db}
      REDIS_URL: redis://redis:6379/0
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-lifethread_production_secret_key_change_in_env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lifethread-internal
      - lifethread-frontend

  mcp-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mcp
    container_name: lifethread-mcp
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8001
    ports:
      - "${MCP_SERVER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lifethread-internal

  agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: lifethread-agent
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      AGENT_WORKER_PORT: 8002
      AGENT_WORKER_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifethread_user}:${POSTGRES_PASSWORD:-lifethread_secure_password}@postgres:5432/${POSTGRES_DB:-lifethread_db}
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      MCP_SERVER_URL: http://mcp-server:8001
    ports:
      - "${AGENT_WORKER_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lifethread-internal

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: lifethread-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lifethread-frontend

volumes:
  postgres_data:
    name: lifethread_postgres_data
  redis_data:
    name: lifethread_redis_data

networks:
  # Isolated network for frontend-to-backend web traffic
  lifethread-frontend:
    name: lifethread_frontend_network
    driver: bridge

  # Fully isolated internal network for database, cache, agent, and tools
  lifethread-internal:
    name: lifethread_internal_network
    driver: bridge
