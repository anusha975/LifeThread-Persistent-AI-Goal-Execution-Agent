# Alembic configuration for LifeThread Backend

[alembic]
# Path to migration scripts
script_location = %(here)s/app/db/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend application root to sys.path
prepend_sys_path = .

# Target database URL (overridden dynamically in env.py from Settings)
sqlalchemy.url = postgresql+asyncpg://lifethread_user:lifethread_password_dev_only@localhost:5432/lifethread_db

output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
